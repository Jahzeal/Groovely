spring.application.name=groovely-backend

# Database (Local Docker PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/groovely_db}
spring.datasource.username=${DB_USERNAME:groovely}
spring.datasource.password=${DB_PASSWORD:groovely_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000


spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=email,profile

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
groovely.jwt.secret=YOUR_JWT_TOKEN
groovely.jwt.expiration=86400000

#  Auth
groovely.auth.nonce-expiry=300000

groovely.auth.google-token-expiry=600000

# IPFS / Pinata
groovely.pinata.jwt=YOUR_JWT_TOKEN
groovely.pinata.gateway=https://gateway.pinata.cloud/ipfs/

# Alchemy + Polygon Network

groovely.polygon.rpc-url=${POLYGON_RPC_URL:https://polygon-amoy.g.alchemy.com/v2/8TWklt2OFUsxJtqkd8DXQ}
groovely.polygon.chain-id=${POLYGON_CHAIN_ID:80002}
groovely.polygon.platform-wallet=0xCCd211FA411743F83EA78A9b7C3dCFEE86f617b7
groovely.polygon.platform-fee-percent=3

# Server
server.port=8080

#Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

#CORS
groovely.cors.allowed-origins = http://localhost:3000,https://groovely.io,https://www.groovely.io

# Frontend
groovely.frontend.url = http://localhost:3000