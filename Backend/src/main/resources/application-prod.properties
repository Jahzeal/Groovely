#Database (Render PostgreSQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#  JWT
groovely.jwt.secret=${JWT_SECRET}
groovely.jwt.expiration=86400000

#  Auth
groovely.auth.nonce-expiry=300000
groovely.auth.google-token-expiry=600000

# IPFS / Pinata
groovely.pinata.jwt=${PINATA_JWT}
groovely.pinata.gateway=https://gateway.pinata.cloud/ipfs/

# Alchemy + Polygon
groovely.polygon.rpc-url=${POLYGON_RPC_URL}
groovely.polygon.chain-id=${POLYGON_CHAIN_ID:80002}
groovely.polygon.platform-wallet=${PLATFORM_WALLET_ADDRESS}
groovely.polygon.platform-fee-percent=3

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

# CORS
groovely.cors.allowed-origins=${FRONTEND_URL:https://grovely.io,https://www.grovely.io}

# Frontend
groovely.frontend.url=${FRONTEND_URL:https://grovely.io}

# Server
server.port=${PORT:8080}